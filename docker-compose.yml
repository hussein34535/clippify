# Clippify v2 — full stack (api + worker + redis + postgres + minio)
# Run:  docker compose up --build
# MinIO is commented out — uncomment when you want local S3 testing.

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://clippify:clippify@postgres:5432/clippify}
      REDIS_URL: redis://redis:6379/0
      STORAGE_DIR: /app/storage
      S3_ENDPOINT: ${S3_ENDPOINT:-}          # e.g. http://minio:9000 when MinIO enabled
      S3_BUCKET: ${S3_BUCKET:-}
    volumes:
      - ./storage:/app/storage
      - ./data:/app/data
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: ${DATABASE_URL:-postgres://clippify:clippify@postgres:5432/clippify}
      MAX_WORKERS: ${MAX_WORKERS:-2}
    volumes:
      - ./storage:/app/storage
      - ./data:/app/data
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: clippify
      POSTGRES_USER: clippify
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-clippify}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clippify -d clippify"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # ---- Optional: local S3-compatible object storage (R2/MinIO dev target) ----
  # minio:
  #   image: minio/minio
  #   command: server /data --console-address ":9001"
  #   environment:
  #     MINIO_ROOT_USER: clippify
  #     MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-clippify-secret}
  #   ports:
  #     - "9000:9000"
  #     - "9001:9001"   # web console
  #   volumes:
  #     - miniodata:/data
  #   healthcheck:
  #     test: ["CMD", "mc", "ready", "local"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 5

volumes:
  pgdata:
