name: Flutter CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'flutter_client/**'
      - '.github/workflows/flutter_ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'flutter_client/**'

jobs:
  analyze_test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        working-directory: flutter_client

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44'
          channel: 'stable'

      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: flutter_client/.dart_tool
          key: ${{ runner.os }}-pub-${{ hashFiles('flutter_client/pubspec.lock') }}

      - name: pub get
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test
