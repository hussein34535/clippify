name: Short Auto Windows

on:
  push:
    branches: [main, develop]
    paths:
      - 'engine/**'
      - 'scripts/short_smoke.mjs'
      - '.github/workflows/short_windows_ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'engine/**'
      - 'scripts/short_smoke.mjs'
      - '.github/workflows/short_windows_ci.yml'

permissions:
  contents: read

jobs:
  short_engine:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install FFmpeg fixture tool
        run: python -m pip install imageio-ffmpeg==0.6.0
      - name: Test and build Rust engine
        working-directory: engine
        run: |
          cargo test --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo build --locked
      - name: Verify Short Auto without a key
        run: |
          $ffmpeg = python -c "import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/short_smoke.mjs engine/target/debug/clippify_engine.exe $ffmpeg
